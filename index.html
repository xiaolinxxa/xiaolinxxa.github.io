<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>HSK Mỗi Ngày</title>
<meta name="theme-color" content="#c8102e">
<meta name="description" content="Học tiếng Trung HSK 1: âm Hán Việt, bài khóa, ngữ pháp, luyện viết chữ Hán, từ điển, trò chơi, thi thử.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;600;800&family=Noto+Sans+SC:wght@500;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/hanzi-writer@3.5.0/dist/hanzi-writer.min.js"></script>
<style>
/* VOICE: vui, khích lệ, như app học thật đang chạy
   IDEA: bao lì xì đỏ + vở ô ly chữ Hán; thẻ từ đỏ úp trên khay, lật ra là học; linh vật chú Nghé (trâu Việt Nam)
   PICTURE: cảnh ruộng bậc thang có chú Nghé động, khay thẻ, thẻ lật 3D, bìa trò chơi vẽ tay
   COLOUR and TYPE: đỏ son chủ đạo, vàng kim nhấn, nền trắng / đêm đỏ sẫm; Be Vietnam Pro + Noto Sans SC
   LAYOUT: khung app tối đa 560px, thanh điều hướng dưới như app điện thoại */
:root{color-scheme:light dark;--bg:light-dark(#fff,#170b0d);--card:light-dark(#fff,#24131a);--soft:light-dark(#fdf0f0,#2e1820);--tray:light-dark(#f7e3d2,#3a2018);--ink:light-dark(#1b1214,#f6ecec);--mut:light-dark(#6b5b5e,#c2aeb2);--red:#c8102e;--red2:light-dark(#9e0b22,#ff6b7d);--gold:#ffb400;--hv:light-dark(#b45309,#f6a04d);--ok:#0a8f55;--bad:#d42d2d;--line:light-dark(#efdfe0,#3a2229)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 "Be Vietnam Pro",system-ui,sans-serif;overflow-x:clip}
.zh{font-family:"Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif}
.app{max-width:560px;margin:0 auto;min-height:100vh;padding-bottom:92px}
body.ob .app{padding-bottom:20px}body.ob nav,body.ob header,body.ob .foot{display:none}
header{background:var(--red);color:#fff;padding:14px 16px 16px;display:flex;align-items:center;gap:10px;border-radius:0 0 22px 22px}
header h1{font-size:19px;margin:0;font-weight:800;flex:1;line-height:1.1}
.chip{background:rgba(255,255,255,.18);border-radius:99px;padding:5px 10px;font-weight:600;font-size:13px;white-space:nowrap}
main{padding:18px 16px}
h2{font-size:26px;line-height:1.15;margin:6px 0 14px;text-wrap:balance}
h3{font-size:18px;margin:20px 0 8px}
p{margin:0 0 10px}
.mut{color:var(--mut);font-size:14px}
.kick{color:var(--mut);font-size:13px;font-weight:600;margin:0}
.card{background:var(--card);border:1.5px solid var(--line);border-radius:18px;padding:16px;margin-bottom:12px}
.hero{display:grid;grid-template-columns:minmax(0,1fr) 112px;gap:12px;align-items:center;background:var(--soft);border:0}
.bar{height:12px;background:var(--line);border-radius:99px;overflow:hidden;margin:8px 0}.bar i{display:block;height:100%;background:var(--gold);border-radius:99px;transition:width .4s}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.tile{display:block;text-align:left;background:var(--card);border:1.5px solid var(--line);border-radius:16px;padding:14px;cursor:pointer;color:inherit;font:inherit;min-height:88px;width:100%}
.tile b{display:block;font-size:16px}.tile span{font-size:13px;color:var(--mut)}
.tile .ic{font-size:26px;line-height:1;color:var(--red2);font-family:"Noto Sans SC",sans-serif;font-weight:700;display:block;margin-bottom:6px}
.tile:hover,.tile:focus-visible{border-color:var(--red)}
button,.btn{font:inherit;font-weight:600;border:0;border-radius:14px;min-height:48px;padding:10px 18px;cursor:pointer;background:var(--red);color:#fff;text-decoration:none;display:inline-grid;place-items:center}
.btn2{background:var(--soft);color:var(--ink);border:1.5px solid var(--line)}
.wide{width:100%;display:grid}
button:focus-visible,input:focus-visible,a:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
button:disabled{opacity:.45;cursor:default}
input[type=text]{font:inherit;font-size:16px;width:100%;padding:13px 14px;border-radius:12px;border:2px solid var(--line);background:var(--card);color:var(--ink);text-align:center}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.stack>*+*{margin-top:10px}
/* lộ trình */
.lesson{display:flex;gap:12px;align-items:center;cursor:pointer;color:inherit;text-decoration:none}
.lesson .n{flex:none;width:52px;height:52px;border-radius:14px;background:var(--red);color:#fff;display:grid;place-items:center;font-size:24px;font-weight:700}
.lesson.lock{opacity:.55;cursor:default}.lesson.lock .n{background:var(--mut)}
.lesson.done .n{background:var(--ok)}
.lesson .t{flex:1}
.dots{display:flex;gap:4px;margin-top:6px}.dots i{height:6px;flex:1;border-radius:9px;background:var(--line)}.dots i.on{background:var(--gold)}
.steps{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;background:var(--soft);border-radius:18px;padding:12px 8px;margin:14px 0}
.step{background:none;color:var(--ink);display:grid;justify-items:center;gap:4px;padding:0;min-height:0;font-size:13px}
.step .c{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;border:2.5px solid var(--line);font-weight:800;background:var(--card)}
.step.done .c{background:var(--ok);border-color:var(--ok);color:#fff}
.step.cur .c{border-color:var(--red);color:var(--red2)}
.step.lock{color:var(--mut)}.step.lock .c{border-style:dashed}
.word{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.word:last-child{border:0}
.word .h{font-size:30px;font-weight:700;min-width:64px;flex:none}
.word .m{flex:1}.word .py{color:var(--red2);font-weight:600}.hvt{color:var(--hv);font-size:14px;font-weight:600}
.spk,.star{flex:none;width:44px;height:44px;min-height:44px;padding:0;border-radius:50%;background:var(--soft);color:var(--red2);border:1.5px solid var(--line);font-size:15px}
.star.on{background:var(--gold);color:#3a1a00;border-color:var(--gold)}
/* khay thẻ */
.tray{background:var(--tray);border-radius:22px;padding:14px;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px;margin-bottom:12px}
.mini{aspect-ratio:3/4;border-radius:10px;display:grid;place-items:center;text-align:center;padding:2px;min-height:0;font-weight:700;line-height:1.1;position:relative}
.mini.down{background:linear-gradient(160deg,#d42a3c,#a30d22);color:var(--gold);border:2px solid var(--gold);font-size:22px}
.mini.down small{position:absolute;right:5px;bottom:2px;font-size:11px;color:#fff}
.mini.down.cur{box-shadow:0 0 0 3px var(--gold);transform:translateY(-3px)}
.mini.up{background:var(--card);color:var(--ink);border:1.5px solid var(--line);font-size:18px;cursor:pointer}
.mini.up span{display:block;font-size:10px;font-weight:600;color:var(--mut);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%}
.flash{min-height:300px;display:grid;place-items:center;text-align:center;cursor:pointer;background:var(--soft);border:2.5px solid var(--gold);border-radius:22px}
.flash .big{font-size:clamp(64px,22vw,110px);font-weight:700;line-height:1}
.flash .py{font-size:22px;color:var(--red2);font-weight:700;margin-top:8px}
.flash .hv{font-size:15px;color:var(--hv);font-weight:700;letter-spacing:.04em;margin-top:2px}
.flash .vn{font-size:24px;font-weight:800;margin-top:4px}
.hint{display:inline-block;margin-top:10px;background:var(--card);border:1.5px dashed var(--hv);border-radius:12px;padding:6px 10px;font-size:14px;max-width:34ch}
.cd{height:8px;background:var(--line);border-radius:9px;overflow:hidden;margin:10px 0}.cd i{display:block;height:100%;width:100%;background:var(--ok);transform-origin:left}
.toggle{display:flex;align-items:center;gap:8px;font-weight:600;font-size:14px;cursor:pointer}
.toggle input{width:22px;height:22px;accent-color:var(--red)}
/* câu đố */
.q{font-size:clamp(52px,18vw,88px);font-weight:700;text-align:center;line-height:1.1;margin:10px 0 0}
.qpy{text-align:center;color:var(--red2);font-weight:600;font-size:18px}
.qtext{font-size:22px;font-weight:800;text-align:center;margin:18px 0}
.opts{display:grid;gap:10px}
.opt{background:var(--card);color:var(--ink);border:2px solid var(--line);text-align:left;font-size:18px;min-height:56px;place-items:center start}
.opt.zh{font-size:26px;place-items:center}
.opt.ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 14%,var(--card))}
.opt.bad{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 14%,var(--card))}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:6px;font-weight:600}
.match{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.match button{background:var(--card);color:var(--ink);border:2px solid var(--line);min-height:62px}
.match button.sel{border-color:var(--gold)}.match button.done{visibility:hidden}.match button.bad{border-color:var(--bad)}
.score{font-size:64px;font-weight:800;color:var(--red2);text-align:center;line-height:1}
/* viết chữ */
.wbox{position:relative;width:min(280px,80vw);aspect-ratio:1;margin:8px auto;border:2.5px solid var(--red);border-radius:6px;background:var(--card);touch-action:none}
.wbox svg.g,.wbox>div,.wbox canvas{position:absolute;inset:0;width:100%;height:100%}
.stroke{display:flex;gap:8px;align-items:center;background:var(--soft);border-radius:99px;padding:6px 12px;font-size:15px;margin:6px auto;width:fit-content;max-width:100%}
.stroke b{flex:none;width:24px;height:24px;border-radius:50%;background:var(--red);color:#fff;display:grid;place-items:center;font-size:13px}
/* onboarding */
.segs{display:flex;gap:6px;justify-content:center;margin:6px 0 18px}.segs i{width:34px;height:7px;border-radius:9px;background:var(--line)}.segs i.on{background:var(--red)}
.obc{text-align:center}
.obc .mascot{width:150px;height:150px;margin:0 auto 8px;display:block}
.choice{display:flex;gap:14px;align-items:center;text-align:left;width:100%;background:var(--card);color:var(--ink);border:2px solid var(--line);border-radius:18px;padding:14px 16px;min-height:72px}
.choice .ci{flex:none;width:46px;height:46px;border-radius:12px;background:var(--soft);color:var(--red2);display:grid;place-items:center;font:700 22px "Noto Sans SC",sans-serif}
.choice b{display:block;font-size:17px}.choice span{font-size:14px;color:var(--mut);font-weight:400}
.choice:hover,.choice.sel{border-color:var(--red)}
.tip{border:1.5px dashed var(--ok);background:color-mix(in srgb,var(--ok) 8%,var(--card));border-radius:14px;padding:10px 14px;font-size:14px;margin-top:16px}
.wordbox{background:var(--soft);border-radius:20px;padding:12px 24px;display:inline-block;font-size:clamp(64px,20vw,96px);font-weight:700;line-height:1.1;cursor:pointer;color:var(--ink);border:0}
.gifts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:16px 0}
.gift{background:var(--soft);border-radius:16px;padding:12px 6px;text-align:center;font-weight:800;font-size:22px}
.gift span{display:block;font-size:12px;font-weight:600;color:var(--mut)}
.coin{display:inline-grid;place-items:center;width:1.3em;height:1.3em;border-radius:50%;background:var(--gold);color:#5a3500;font:800 .7em "Noto Sans SC",sans-serif;vertical-align:-.2em}
/* huy hiệu */
.badges{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.bdg{text-align:center;font-size:12px;font-weight:600;color:var(--mut)}
.bdg i{display:grid;place-items:center;width:56px;height:56px;margin:0 auto 4px;border-radius:50%;background:var(--line);font:700 24px "Noto Sans SC",sans-serif;font-style:normal;color:var(--mut)}
.bdg.on{color:var(--ink)}.bdg.on i{background:radial-gradient(circle at 35% 30%,#ffe08a,var(--gold));color:#7a2a00;box-shadow:0 0 0 3px var(--red)}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;text-align:center}
.stats div{background:var(--soft);border-radius:14px;padding:10px 4px;font-size:22px;font-weight:800}.stats span{display:block;font-size:12px;font-weight:600;color:var(--mut)}
nav{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1.5px solid var(--line);display:flex;justify-content:center;padding:6px 4px calc(6px + env(safe-area-inset-bottom));z-index:5}
nav div{display:flex;max-width:560px;width:100%}
nav a{flex:1;text-align:center;text-decoration:none;color:var(--mut);font-size:12px;font-weight:600;padding:6px 2px;border-radius:12px;min-height:52px}
nav a b{display:block;font-family:"Noto Sans SC",sans-serif;font-size:20px;line-height:1.2}
nav a.on{color:var(--red2);background:var(--soft)}
.foot{display:flex;align-items:center;justify-content:center;gap:8px;padding:6px 16px 18px;font-size:14px;font-weight:600;color:var(--mut);text-align:center}.foot svg{flex:none}
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;z-index:9;max-width:90vw;opacity:0;transition:opacity .25s;pointer-events:none;text-align:center}
.toast.on{opacity:1}
.linkbox{word-break:break-all;background:var(--soft);padding:10px;border-radius:10px;font-size:13px}
@media (prefers-reduced-motion:no-preference){.pop{animation:pop .35s ease}@keyframes pop{0%{transform:scale(.94);opacity:.4}100%{transform:none;opacity:1}}.cd i{transition:transform linear}}
@media(max-width:380px){.hero{grid-template-columns:minmax(0,1fr) 84px}h2{font-size:22px}.tray{gap:6px;padding:10px}.mini.down{font-size:18px}.badges{grid-template-columns:repeat(3,minmax(0,1fr))}}
:root{--title:light-dark(#9e0b22,#ffb84d)}
.steps{grid-template-columns:repeat(6,minmax(0,1fr));gap:2px;padding:12px 4px}
.step{font-size:11.5px;line-height:1.2;text-align:center}.step .c{width:36px;height:36px}
.pill{border:2px solid var(--red);color:var(--red2);border-radius:99px;padding:4px 12px;font-weight:800;font-size:14px}
.duo{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(0,1fr);gap:10px;margin:14px 0 12px}
.big1,.big2{border-radius:22px;padding:16px;text-decoration:none;display:grid;gap:6px;align-content:start}
.big1{background:linear-gradient(150deg,#d42a3c,#9e0b22);color:#fff}
.big2{background:linear-gradient(160deg,#ffcf5a,#f5a524);color:#4a2a00;text-align:center;justify-items:center}
.big2 span{font-size:13px}
.quest{display:flex;gap:12px;align-items:center;padding:10px 14px;margin-bottom:8px}
.quest .ci,.choice .ci{flex:none;width:40px;height:40px;border-radius:50%;background:var(--soft);color:var(--red2);display:grid;place-items:center;font:700 20px "Noto Sans SC",sans-serif}
.quest.done{border-color:var(--ok)}.quest.done .ci{background:var(--ok);color:#fff}
.quick{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.quick a{background:var(--card);border:1.5px solid var(--line);border-radius:16px;padding:12px 4px;text-align:center;text-decoration:none;color:var(--ink);font-size:13px;font-weight:600;display:grid;gap:4px}
.quick a span{font-size:28px;color:var(--red2);font-weight:700}
.lesson.curl{border-color:var(--ok);box-shadow:0 0 0 2px color-mix(in srgb,var(--ok) 30%,transparent)}
.lesson>span:last-child{color:var(--mut);flex:none}
.gq{font-size:clamp(28px,8vw,40px);font-weight:700;text-align:center;line-height:1.3;margin:18px 0 6px}
.blank{display:inline-block;min-width:1.6em;border-bottom:3px solid var(--red);color:var(--red2)}
.opts.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.opts.g4 .opt{place-items:center;font-size:20px;font-weight:700}
input[type=search]{font:inherit;font-size:17px;width:100%;padding:14px 16px;border-radius:16px;border:2.5px solid var(--red);background:var(--card);color:var(--ink)}
.chipb{background:var(--soft);color:var(--ink);border:1.5px solid var(--line);border-radius:99px;min-height:40px;padding:6px 14px;font-weight:600}
.topics{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-bottom:14px}
.topic{background:var(--tray);color:var(--ink);border-radius:16px;display:grid;gap:2px;justify-items:center;padding:12px 6px;min-height:0;text-align:center}
.topic span.zh{font-size:28px;color:var(--red2)}.topic b{font-size:14px}.topic span:last-child{font-size:12px;color:var(--mut);font-weight:600}
.idiom{background:var(--tray);border:0}
.word .h{background:none;border:0;color:var(--ink);padding:0;min-height:44px;text-align:left;cursor:pointer;place-items:center start;font-weight:700}
.chars{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:8px 0 16px}
.ch{background:var(--tray);color:var(--ink);border:2px dashed var(--hv);border-radius:16px;display:grid;justify-items:center;padding:10px 18px;min-height:0}
.ch .zh{font-size:40px;font-weight:700;line-height:1.1}.ch b{color:var(--hv);font-size:15px}
.plus{font-weight:800;color:var(--mut)}
.exl{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.exl:last-child{border:0}.exl .zh{font-size:20px;font-weight:600}.exl .mut{grid-column:1/-1}
.dlg{display:grid;gap:10px;margin-bottom:12px}
.bub{display:grid;gap:2px;text-align:left;background:var(--soft);color:var(--ink);border:2px solid transparent;border-radius:18px 18px 18px 4px;padding:10px 14px 10px 44px;position:relative;max-width:88%;justify-self:start;min-height:0;place-items:start;font-weight:400}
.bub.r{justify-self:end;border-radius:18px 18px 4px 18px;background:color-mix(in srgb,var(--gold) 18%,var(--card))}
.bub.on{border-color:var(--red)}
.who{position:absolute;left:10px;top:10px;width:26px;height:26px;border-radius:50%;background:var(--red);color:#fff;display:grid;place-items:center;font-size:13px;font-weight:800}
.bub.r .who{background:#b45309}
.zl{font-size:22px;font-weight:600}.pyl{color:var(--red2);font-size:14px;font-weight:600}.trl{color:var(--mut);font-size:14px}
.ggroup{border:2px solid color-mix(in srgb,var(--gc) 45%,transparent);border-radius:22px;padding:4px 14px 14px;margin-bottom:14px;background:color-mix(in srgb,var(--gc) 6%,var(--bg))}
.ggroup h3{color:var(--gc);margin-bottom:2px}.ggroup .ic{color:var(--gc)}
.tile.lockt{opacity:.5;filter:grayscale(1)}
.mem{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.mc{position:relative;aspect-ratio:4/3;padding:0;min-height:0;background:none;border:0;perspective:600px}
.mc span{position:absolute;inset:0;display:grid;place-items:center;border-radius:14px;backface-visibility:hidden;transition:transform .35s;padding:4px;text-align:center}
.mc .back{background:linear-gradient(160deg,#d42a3c,#a30d22);color:var(--gold);font-size:28px;border:2px solid var(--gold)}
.mc .face{background:var(--card);color:var(--ink);border:2px solid var(--line);transform:rotateY(180deg);font-size:15px;font-weight:700}
.mc .face.zh{font-size:28px}
.mc.up .back{transform:rotateY(180deg)}.mc.up .face{transform:none}
.mc.got .face{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 14%,var(--card))}
.seg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));background:var(--soft);border-radius:14px;padding:4px;gap:4px}
.seg button{background:none;color:var(--ink);min-height:42px}.seg button.on{background:var(--red);color:#fff}
body.bigfont .app{zoom:1.12}
.namec{text-align:center}
.nmap{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin:12px 0}
.nmap div{background:var(--soft);border-radius:14px;padding:8px 12px;display:grid;justify-items:center;min-width:64px}
.nmap .zh{font-size:28px;font-weight:700}.nmap b{font-size:13px;color:var(--hv)}.nmap small{color:var(--mut)}
.soon{border-style:dashed}
details.card summary{cursor:pointer;min-height:28px}
a.tile{text-decoration:none;color:inherit}

{t:'这儿能坐吗？',v:'Chỗ này ngồi được không?',ic:'坐',w:'能 椅子 桌子 上 下 里 前面 后面 电脑 猫 狗',

 g:{t:'能 xin phép; từ chỉ vị trí',n:'能 + động từ: có thể, được phép: 这儿能坐吗? Chỉ vị trí: danh từ + 上 (trên) / 里 (trong) / 前面 (trước) / 后面 (sau): 桌子上, 家里.',ex:[['这儿能坐吗？','Chỗ này ngồi được không?'],['猫在家里。','Mèo ở trong nhà.']],

// Chú Nghé 3D (ảnh do Gemini vẽ): happy | wave | cheer | sad | think | sleep | head
const NGI={};
for(const k in NGB64){try{const bin=atob(NGB64[k]),u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);NGI[k]=URL.createObjectURL(new Blob([u],{type:'image/webp'}))}catch(e){NGI[k]='data:image/webp;base64,'+NGB64[k]}}
function nghe(pose='happy',cls=''){return `<span class="ng ng3 ${pose} ${cls}" aria-hidden="true"><img src="${NGI[pose]||NGI.happy}" alt="" draggable="false"></span>`}
const ngImage=(pose,x,y,w,h)=>`<image class="ngi ${pose}" href="${NGI[pose]||NGI.happy}" x="${x}" y="${y}" width="${w}" height="${h}" preserveAspectRatio="xMidYMax meet"/>`;

function confetti(x,y,n=26){
  if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;
  const box=document.createElement('div');box.className='cf';box.style.left=x+'px';box.style.top=y+'px';
  const cols=['#c8102e','#ffb400','#0a8f55','#2f6fd6','#ff6b7d','#7c3aed'];
  for(let i=0;i<n;i++){const p=document.createElement('i');const a=Math.random()*Math.PI*2,d=60+Math.random()*120;
    p.style.cssText=`--dx:${Math.cos(a)*d}px;--dy:${Math.sin(a)*d-60}px;--r:${Math.random()*720-360}deg;background:${cols[i%cols.length]};width:${6+Math.random()*6}px;height:${8+Math.random()*8}px;animation-delay:${Math.random()*.08}s`;box.appendChild(p)}
  document.body.appendChild(box);setTimeout(()=>box.remove(),1400);
}

function distract(w,pool,key,n=3){const c=shuffle(pool.length>=8?pool:W).concat(shuffle(W)).filter(x=>x.h!==w.h&&x.m!==w.m&&!sameSound(x,w));const out=[];for(const x of c){if(!out.some(o=>o[key]===x[key]))out.push(x);if(out.length===n)break}return out}

function runQuiz(qs,opt){
  const my=++RUN;let i=0,score=0,wrong=[],left=opt.timer||0,tick=null,locked=false;window.scrollTo(0,0);
  const end=()=>{clearInterval(tick);fbHide();if(my!==RUN)return;RUN++;opt.onEnd(score,qs.length,wrong)};
  if(opt.timer)tick=setInterval(()=>{if(my!==RUN)return clearInterval(tick);left--;const e=$('#tm');if(e)e.textContent=fmt(left);if(left<=0)end()},1000);
  function show(){
    if(my!==RUN)return;if(i>=qs.length)return end();
    const q=qs[i];locked=false;
    V.innerHTML=`${opt.head||''}<div class="top"><span>${esc(opt.title)}</span><span>${opt.timer?'<span id="tm">'+fmt(left)+'</span> · ':''}${i+1}/${qs.length}</span></div>
    <div class="bar"><i style="width:${i/qs.length*100}%"></i></div><div class="pop">${q.prompt}</div>
    <div class="opts ${q.grid?'g4':''}">${q.opts.map((o,k)=>`<button class="opt ${q.zh?'zh':''}" data-k="${k}">${esc(o.t)}</button>`).join('')}</div>${opt.tip?`<div class="tip">${opt.tip}</div>`:''}`;
    if(q.listen)setTimeout(()=>{if(my===RUN)say(q.w.h)},250);
    V.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{
      if(locked)return;locked=true;const o=q.opts[+b.dataset.k];
      V.querySelectorAll('.opt').forEach((x,k)=>{if(q.opts[k].ok)x.classList.add('ok')});
      fbShow(o.ok,o.ok?'':q.opts.find(x=>x.ok).t,b);
      if(o.ok){score++;addXp(opt.xp??10);if(opt.srs&&S.srs[q.w.h])grade(q.w.h,true)}else{b.classList.add('bad');wrong.push(q.w);if(opt.srs&&S.srs[q.w.h])grade(q.w.h,false)}
      if(!q.listen&&opt.speak!==false)say(q.w.h);
      setTimeout(()=>{fbHide();i++;show()},o.ok?900:1600);
    });
  }
  show();
}

    <div class="tray ${first?'deal':''}">${words.map((x,k)=>placed.has(x)?`<button class="mini up ${x===justPlaced?'new':''}" data-peek="${k}" style="--i:${k}"><span class="zh" style="font-size:18px;color:var(--ink);font-weight:700">${esc(x.h.length>2?x.h.slice(0,2)+'…':x.h)}</span><span>${esc(x.m)}</span></button>`:`<div class="mini down zh ${x===w?'cur':''}" style="--i:${k}">学<small>${k+1}</small></div>`).join('')}</div>

      <div class="face front"><div>${pic(w)}<div class="big zh">${esc(w.h)}</div>${S.pinyin?`<div class="py">${esc(w.p)}</div>`:''}<p class="mut" style="margin-top:10px">Chạm để lật thẻ</p></div></div>
      <div class="face back"><div><div class="big zh">${esc(w.h)}</div><div class="py">${esc(w.p)}</div><div class="hv">HÁN VIỆT: ${esc(w.hv.toUpperCase())}</div><div class="vn">${esc(w.m)}</div>${HINT[w.h]?`<div class="hint">${esc(HINT[w.h])}</div>`:''}</div></div>
    </div></div>
    <div class="cd" id="cdw"><i id="cdb"></i></div>
    <div class="row" style="justify-content:center;margin-bottom:12px">${spk(w.h)}${star(w.h)}</div>
    <div class="grid2"><button class="btn2" id="no" disabled>Chưa nhớ</button><button id="yes" disabled>Đặt lên khay</button></div>`;
    first=false;justPlaced=null;
    $('#fc').onclick=()=>{if(!flipped)flip()};$('#fc').onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();$('#fc').onclick()}};
    $('#auto').onchange=e=>{S.auto=e.target.checked;save();if(S.auto&&!flipped)later(flip,600)};

      const sz=$('#wb').clientWidth;
      writer=HanziWriter.create('hw',ch,{width:sz,height:sz,padding:sz*.08,showCharacter:false,showOutline:true,strokeColor:'#c8102e',radicalColor:'#c8102e',outlineColor:'#e4cfd2',drawingColor:getComputedStyle(document.body).color,drawingWidth:22,strokeAnimationSpeed:1,delayBetweenStrokes:250,
        onLoadCharDataSuccess:()=>{if(done)return;done=true;clearTimeout(to);writer.animateCharacter({onComplete:quiz})},
        onLoadCharDataError:()=>{clearTimeout(to);fallback()}});
      $('#demo').onclick=()=>{if(writer&&!$('#cv')){writer.cancelQuiz();writer.animateCharacter({onComplete:quiz})}};
    }catch(e){clearTimeout(to);fallback()}
  }
  function tracing(ch,next){
    const wb=$('#wb');wb.innerHTML=GRID+'<canvas id="cv"></canvas>';
    const cv=$('#cv'),sz=wb.clientWidth,dpr=window.devicePixelRatio||1;cv.width=sz*dpr;cv.height=sz*dpr;const c=cv.getContext('2d');c.scale(dpr,dpr);
    const ink=getComputedStyle(document.body).color;
    const guide=()=>{c.clearRect(0,0,sz,sz);c.fillStyle='rgba(200,16,46,.16)';c.font=`700 ${sz*.78}px "Noto Sans SC",sans-serif`;c.textAlign='center';c.textBaseline='middle';c.fillText(ch,sz/2,sz/2+sz*.03)};guide();
    $('#msg').textContent='Tô theo chữ mờ bằng ngón tay';
    let draw=false,lines=0;
    const pt=e=>{const r=cv.getBoundingClientRect();return[e.clientX-r.left,e.clientY-r.top]};
    cv.onpointerdown=e=>{draw=true;cv.setPointerCapture(e.pointerId);const[x,y]=pt(e);c.beginPath();c.moveTo(x,y);c.strokeStyle=ink;c.lineWidth=sz*.055;c.lineCap='round';c.lineJoin='round'};
    cv.onpointermove=e=>{if(!draw)return;const[x,y]=pt(e);c.lineTo(x,y);c.stroke()};
    cv.onpointerup=()=>{if(draw){draw=false;lines++;$('#skip').textContent='Xong, chữ tiếp →';$('#skip').className=''}};
    $('#demo').textContent='Xóa viết lại';$('#demo').onclick=()=>{guide();lines=0};
    $('#skip').onclick=()=>{if(lines)addXp(5);next()};
  }
  show();
}

// ===== TÊN TIẾNG TRUNG =====
function toZh(full){
  const parts=full.trim().toLowerCase().normalize('NFC').split(/\s+/).filter(Boolean);
  const out=parts.map((p,i)=>{const m=(i===0&&parts.length>1&&SM[p])?SM[p]:GM[p]||SM[p];return m?{v:p,c:m.c,p:m.p}:{v:p,c:'？',p:'?'}});
  return{list:out,c:out.map(x=>x.c).join(''),p:out.map(x=>x.p).join(' '),ok:out.length>0&&out.every(x=>x.c!=='？')};
}

// ===== TỪ ĐIỂN =====
function searchHtml(v){
  const raw=v.toLowerCase().normalize('NFC'),q=norm(v);if(!q&&!raw)return'';
  const isPy=/[0-9]/.test(v)||/[āáǎàēéěèīíǐìōóǒòūúǔùǖǘǚǜ]/i.test(v);
  const sc=w=>{if(w.h===v)return 100;if(w.h.includes(v))return 90;const np=norm(w.p),nh=norm(w.hv),nm=norm(w.m);if(isPy)return np===q?95:np.startsWith(q)?70:0;
    if(np===q||nh===q)return 80;if(w.m.toLowerCase().split(/,\s*/).includes(raw))return 78;if(w.hv.toLowerCase()===raw)return 77;
    if(np.startsWith(q))return 60;if(w.m.toLowerCase().includes(raw)||w.hv.toLowerCase().includes(raw))return 55;if(nh.startsWith(q))return 50;if(q.length>=2&&(nm.includes(q)||np.includes(q)||nh.includes(q)))return 30;return 0};
  const r=W.map(w=>[sc(w),w]).filter(x=>x[0]>0).sort((a,b)=>b[0]-a[0]).slice(0,30).map(x=>x[1]);
  return r.length?`<p class="mut">${r.length} kết quả · chạm chữ Hán để xem chi tiết</p><div class="card">${r.map(wordRow).join('')}</div>`:'<p class="mut">Không tìm thấy trong từ vựng HSK 1. Thử gõ kiểu khác nhé.</p>';
}
function wordView(h){
  const w=byH(h);if(!w)return charView(h);
  const ex=LESSONS.flatMap((L,i)=>L.d.filter(d=>d[1].includes(h)).map(d=>[d,i])).slice(0,3);
  V.innerHTML=`${backBar('#dict','Từ điển')}<div class="card wordc">${pic(w)}<div class="row" style="align-items:flex-end;gap:14px"><span class="zh" style="font-size:72px;font-weight:700;line-height:1">${esc(w.h)}</span><span><b style="color:var(--red2);font-size:22px">${esc(w.p)}</b><br><span class="hvt" style="font-size:18px">${esc(w.hv)}</span></span></div>
  <p style="font-size:20px;font-weight:700;margin:10px 0">${esc(w.m)}</p>${HINT[w.h]?`<div class="hint">${esc(HINT[w.h])}</div>`:''}
  <div class="row" style="margin-top:12px">${spk(w.h)}${star(w.h)}<button class="btn2" id="wr">Luyện viết</button></div></div>
  <p class="kick">CHIẾT TỰ · BẤM TỪNG CHỮ ĐỂ TRA</p><div class="chars">${[...w.h].map((c,i)=>`${i?'<span class="plus">+</span>':''}<button class="ch" data-ch="${esc(c)}"><span class="zh">${esc(c)}</span><b>${esc(CHV[c]||'')}</b></button>`).join('')}</div>
  ${ex.length?`<h3>Câu ví dụ trong bài</h3><div class="card">${ex.map(([d,i])=>`<div class="exl"><span class="zh">${esc(d[1])}</span>${spk(d[1])}<span class="mut">${esc(d[3])} · Bài ${i+1}</span></div>`).join('')}</div>`:''}`;
  $('#wr').onclick=()=>writePractice([...w.h],'Luyện viết '+w.h,()=>wordView(h));
  V.querySelectorAll('[data-ch]').forEach(b=>b.onclick=()=>charView(b.dataset.ch));window.scrollTo(0,0);
}
function charView(c){

// ===== BÀI HỌC THEO CHẶNG =====
function openLesson(i){
  const L=LESSONS[i];if(!L)return views.home();
  if(!unlocked(i)){toast('Qua Boss bài trước để mở bài này');location.hash='home';return}
  const P=prog(i),nextK=P.s.findIndex(x=>!x);
  const open=k=>k===0||!!P.s[k-1];
  V.innerHTML=`${backBar('#home','Lộ trình')}<p class="kick">BÀI ${i+1} · ${esc(L.v.toUpperCase())}</p>
  <div class="row" style="gap:8px"><h2 class="zh" style="font-size:34px;margin:4px 0">${esc(L.t)}</h2>${spk(L.t)}</div>
  <div class="steps">${STAGES.map((n,k)=>{const st=P.s[k]?'done':open(k)?'cur':'lock';return`<button class="step ${st}" data-st="${k}" ${st==='lock'?'disabled':''}><span class="c">${P.s[k]?'✓':st==='lock'?lockIc:k+1}</span>${n}</button>`}).join('')}</div>
  <button class="wide" id="go">${nextK<0?'Ôn lại bài · đánh Boss lại':'Học chặng '+(nextK+1)+': '+STAGES[nextK]}</button>
  <p class="mut" style="margin-top:8px">Học lần lượt từ trái sang phải. Boss đúng từ 7/10 câu là qua bài.</p>
  <div class="row" style="justify-content:space-between"><h3>Từ mới bài này (${L.words.length})</h3><label class="toggle"><input type="checkbox" id="py" ${S.pinyin?'checked':''}> Pinyin</label></div>
  <div class="card">${L.words.map(wordRow).join('')}</div>`;
  V.querySelectorAll('[data-st]').forEach(b=>b.onclick=()=>stage(i,+b.dataset.st));
  $('#go').onclick=()=>stage(i,nextK<0?5:nextK);
  $('#py').onchange=e=>{S.pinyin=e.target.checked;save();openLesson(i)};
}
function stage(i,k){
  const L=LESSONS[i],P=prog(i),t=`Bài ${i+1} · ${STAGES[k]}`;rnd=Math.random;window.scrollTo(0,0);
  const mark=()=>{P.s[k]=1;save()};
  const nextBtn=k<5?['Học chặng tiếp: '+STAGES[k+1],()=>stage(i,k+1)]:null;
  const back=['#bai-'+(i+1),'Về bài học'];
  if(k===0)boardStudy(L.words,t,()=>{L.words.forEach(w=>learn(w.h));mark();checkBadges();resultBox(t,`Bạn đã đặt hết ${L.words.length} thẻ lên khay. Các từ này đã vào lịch ôn tập.`,nextBtn,'#bai-'+(i+1))});
  if(k===1){const qs=fill(L.words,8).map((w,j)=>makeQ(w,j%2?'pinyin':'listen',L.words));
    runQuiz(qs,{title:t,onEnd:(s,n,wr)=>{mark();resultView(t,s,n,wr,()=>stage(i,1),'',nextBtn,back)}})}
  if(k===2)dialogue(i);
  if(k===3)grammarStage(i);
  if(k===4){const chars=[...new Set(L.words.filter(w=>w.h.length===1).map(w=>w.h).concat(L.words.flatMap(w=>[...w.h])))].slice(0,3);
    writePractice(chars,t,()=>{mark();resultBox(t,'Bạn đã tập viết '+chars.join(' ')+'.',nextBtn,'#bai-'+(i+1))})}
  if(k===5){const qs=fill(L.words,7).map((w,j)=>makeQ(w,['meaning','hanzi','listen','pinyin'][j%4],L.words)).concat(shuffle(L.g.q).map(gramQ));
    runQuiz(shuffle(qs),{title:'Boss · Bài '+(i+1),tip:'Đúng từ 7/10 câu là qua bài.',onEnd:(s,n,wr)=>{
      const pass=s>=7;P.boss=Math.max(P.boss||0,s);if(pass){P.s[5]=1;if(!P.pass){P.pass=1;S.coins+=20;give('boss1')}}save();chips();
      const nx=LESSONS[i+1];
      resultView(pass?'Hạ Boss thành công!':'Chưa qua Boss',s,n,wr,()=>stage(i,5),pass?`<p style="text-align:center"><b>+20 xu</b> · ${nx?'Đã mở Bài '+(i+2):'Bạn đã học hết HSK 1!'}</p>`:'<p style="text-align:center">Cần đúng ít nhất 7/10. Ôn lại rồi đánh Boss lần nữa nhé!</p>',pass&&nx?['Sang Bài '+(i+2)+' →',()=>{location.hash='bai-'+(i+2)}]:null,back)}})}
}

    <div class="flip3d" id="fc" role="button" tabindex="0" aria-label="Lật thẻ"><div class="in">
      <div class="face front"><div>${pic(w)}<div class="big zh">${esc(w.h)}</div><p class="mut" style="margin-top:10px">Nhớ nghĩa chưa? Chạm để lật thẻ</p></div></div>
      <div class="face back"><div><div class="big zh">${esc(w.h)}</div><div class="py">${esc(w.p)}</div><div class="hv">HÁN VIỆT: ${esc(w.hv.toUpperCase())}</div><div class="vn">${esc(w.m)}</div>${HINT[w.h]?`<div class="hint">${esc(HINT[w.h])}</div>`:''}</div></div>
    </div></div>
    <div class="row" style="justify-content:center;margin:12px 0">${spk(w.h)}${star(w.h)}</div>
    <div class="grid2"><button style="background:var(--bad)" id="no" disabled>Quên rồi</button><button style="background:var(--ok)" id="yes" disabled>Nhớ</button></div>`;
    const fc=$('#fc');fc.onclick=()=>{if(!flip){flip=true;fc.classList.add('is-flipped');$('#yes').disabled=false;$('#no').disabled=false;sayBoth(w)}};fc.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();fc.onclick()}};
    const nx=()=>{i++;qAdd('rev');show()};
    $('#yes').onclick=()=>{if(S.srs[w.h])grade(w.h,true);addXp(5);nx()};
    $('#no').onclick=()=>{if(S.srs[w.h])grade(w.h,false);if(!isSrs)list.push(w);addXp(1);nx()};
  }
  show();
}

// ===== TRÒ CHƠI =====
const pool=()=>learned().length>=8?learned():W;
const best=(gi,s)=>{S.best['g'+gi]=Math.max(S.best['g'+gi]||0,s);qAdd('game');save()};
const GB=['#games','Về trò chơi'];
function quizGame(type,name,gi){const P=pool();const qs=sample(P,10).map(w=>makeQ(w,type,P));runQuiz(qs,{title:name,srs:true,onEnd:(s,t,wr)=>{best(gi,s);resultView(name,s,t,wr,()=>quizGame(type,name,gi),'',null,GB)}})}
const TONES={1:'āēīōūǖ',2:'áéíóúǘ',3:'ǎěǐǒǔǚ',4:'àèìòùǜ'};
const toneOf=p=>{for(const k in TONES)for(const c of TONES[k])if(p.includes(c))return+k;return 5};
const plain=p=>p.normalize('NFD').replace(/[̀-ͯ]/g,'').normalize('NFC');
const GAMES=[
 {ic:'意',name:'Đoán nghĩa',d:'Nhìn chữ, chọn nghĩa',run:g=>quizGame('meaning','Đoán nghĩa',g)},
 {ic:'字',name:'Tìm chữ',d:'Nhìn nghĩa, chọn chữ',run:g=>quizGame('hanzi','Tìm chữ',g)},
 {ic:'听',name:'Nghe chọn chữ',d:'Luyện tai nghe',run:g=>quizGame('listen','Nghe chọn chữ',g)},
 {ic:'音',name:'Pinyin đúng',d:'Chọn cách đọc',run:g=>quizGame('pinyin','Pinyin đúng',g)},
 {ic:'对',name:'Ghép cặp',d:'Nối chữ với nghĩa',run:g=>matchGame(g)},
 {ic:'快',name:'Đua 60 giây',d:'Trả lời càng nhiều càng tốt',lv:2,run:g=>speedGame(g)},
 {ic:'是',name:'Đúng hay sai',d:'Phản xạ 45 giây',run:g=>tfGame(g)},
 {ic:'写',name:'Luyện viết',d:'Viết 3 chữ đã học',run:()=>views.writing()},
 {ic:'翻',name:'Lật thẻ ghép đôi',d:'Lật 12 thẻ, tìm cặp',run:g=>memoryGame(g)},
 {ic:'调',name:'Đua thanh điệu',d:'Chữ này thanh mấy?',lv:3,run:g=>toneGame(g)}
];
const GROUPS=[{n:'Hành động',c:'#d42d2d',d:'Phản xạ nhanh, nhận mặt chữ tức thì',ids:[5,6,9]},{n:'Mini game',c:'#0a8f55',d:'Chơi nhanh 1–3 phút với từ đã học',ids:[8,4]},{n:'Luyện từ',c:'#b45309',d:'Từng kỹ năng: nghĩa, chữ, nghe, đọc, viết',ids:[0,1,2,3,7]},{n:'Đối kháng',c:'#7c3aed',d:'Đấu với bạn bè bằng link',ids:[],extra:`<a class="gtile" href="#friends"><svg class="cover" viewBox="0 0 160 90" preserveAspectRatio="xMidYMid slice" aria-hidden="true"><defs><linearGradient id="cvf" x1="0" y1="0" x2="1" y2="0"><stop offset=".5" stop-color="#bcd7ff"/><stop offset=".5" stop-color="#ffc2cf"/></linearGradient></defs><rect width="160" height="90" fill="url(#cvf)"/>${ngImage('happy',4,6,70,82)}${ngImage('think',86,6,70,82)}<path d="M86 8L70 46h14L72 84l22-46H80z" fill="#ffcd00" stroke="#c98a00" stroke-width="2"/></svg><span class="gt"><b>Thách đấu bạn bè</b><span>Gửi link qua Zalo, so điểm</span></span></a>`}];
function matchGame(gi){
  const alive=live();const ws=sample(pool(),6);let cards=shuffle([...ws.map(w=>({w,t:w.h,zh:1})),...ws.map(w=>({w,t:w.m,zh:0}))]);let sel=null,left=6,miss=0;const t0=Date.now();
  V.innerHTML=`<div class="top"><span>Ghép cặp</span><span id="mm">Còn 6 cặp</span></div><p class="mut">Chạm một chữ Hán rồi chạm nghĩa của nó.</p><div class="match">${cards.map((c,k)=>`<button data-k="${k}" class="${c.zh?'zh':''}" style="${c.zh?'font-size:26px':''}">${esc(c.t)}</button>`).join('')}</div>`;
  V.querySelectorAll('.match button').forEach(b=>b.onclick=()=>{
    const c=cards[+b.dataset.k];
    if(!sel){sel=b;b.classList.add('sel');if(c.zh)say(c.w.h);return}
    if(sel===b){b.classList.remove('sel');sel=null;return}
    const a=cards[+sel.dataset.k];
    if(a.w===c.w&&a.zh!==c.zh){sel.classList.add('done');b.classList.add('done');left--;addXp(5);$('#mm').textContent='Còn '+left+' cặp';sel=null;
      if(!left&&alive()){const sec=Math.round((Date.now()-t0)/1000);const sc=Math.max(0,60-sec-miss*3);best(gi,sc);resultView('Ghép cặp',6,6,[],()=>matchGame(gi),`<p style="text-align:center">${sec} giây · sai ${miss} lần · <b>${sc} điểm</b></p>`,null,GB)}}
    else{miss++;const s=sel;s.classList.remove('sel');b.classList.add('bad');s.classList.add('bad');setTimeout(()=>{b.classList.remove('bad');s.classList.remove('bad')},400);sel=null}
  });
}
function memoryGame(gi){
  const alive=live();const ws=sample(pool(),6);const cards=shuffle([...ws.map(w=>({w,t:w.h,zh:1})),...ws.map(w=>({w,t:w.m,zh:0}))]);let open=[],found=0,moves=0,lock=false;const t0=Date.now();
  V.innerHTML=`<div class="top"><span>Lật thẻ ghép đôi</span><span id="mv">0 lượt</span></div><p class="mut">Lật 2 thẻ: một chữ Hán và nghĩa của nó thì giữ lại.</p><div class="mem">${cards.map((c,k)=>`<button class="mc" data-k="${k}" aria-label="Thẻ ${k+1}"><span class="back zh">学</span><span class="face ${c.zh?'zh':''}">${esc(c.t)}</span></button>`).join('')}</div>`;
  V.querySelectorAll('.mc').forEach(b=>b.onclick=()=>{
    if(lock||b.classList.contains('up'))return;const c=cards[+b.dataset.k];b.classList.add('up');if(c.zh)say(c.w.h);open.push([b,c]);
    if(open.length<2)return;moves++;$('#mv').textContent=moves+' lượt';const[[b1,c1],[b2,c2]]=open;open=[];
    if(c1.w===c2.w&&c1.zh!==c2.zh){b1.classList.add('got');b2.classList.add('got');found++;addXp(5);
      if(found===6&&alive()){const sec=Math.round((Date.now()-t0)/1000);const sc=Math.max(0,100-moves*4-Math.floor(sec/3));setTimeout(()=>{best(gi,sc);resultView('Lật thẻ ghép đôi',6,6,[],()=>memoryGame(gi),`<p style="text-align:center">${moves} lượt · ${sec} giây · <b>${sc} điểm</b></p>`,null,GB)},600)}}
    else{lock=true;setTimeout(()=>{b1.classList.remove('up');b2.classList.remove('up');lock=false},850)}
  });
}
function toneGame(gi){
  const P=W.filter(w=>w.h.length===1&&toneOf(w.p)<5);const marks={1:'ˉ',2:'ˊ',3:'ˇ',4:'ˋ'};
  const qs=fill(P,40).map(w=>{const t=toneOf(w.p);return{w,grid:1,prompt:`<div class="q zh">${esc(w.h)}</div><div class="qpy" style="font-size:26px">${esc(plain(w.p))}</div><p class="mut" style="text-align:center">Chữ này thanh mấy?</p>`,opts:[1,2,3,4].map(k=>({t:`Thanh ${k} ${marks[k]}`,ok:k===t}))}});
  runQuiz(qs,{title:'Đua thanh điệu',timer:45,xp:5,onEnd:(s,t,wr)=>{best(gi,s);resultView('Hết giờ!',s,s+wr.length,wr.slice(0,8),()=>toneGame(gi),`<p style="text-align:center">Kỷ lục: <b>${S.best['g'+gi]}</b> câu đúng</p>`,null,GB)}});
}
function speedGame(gi){const P=pool();const qs=Array.from({length:60},()=>{const w=P[Math.floor(rnd()*P.length)];return makeQ(w,rnd()<.5?'meaning':'hanzi',P)});
  runQuiz(qs,{title:'Đua 60 giây',timer:60,xp:5,speak:false,onEnd:(s,t,wr)=>{best(gi,s);resultView('Hết giờ!',s,s+wr.length,wr.slice(0,8),()=>speedGame(gi),`<p style="text-align:center">Kỷ lục: <b>${S.best['g'+gi]}</b> câu đúng</p>`,null,GB)}})}
function tfGame(gi){const P=pool();const qs=sample(P,12).map(w=>{const truth=rnd()<.5;const m=truth?w.m:distract(w,P,'m',1)[0].m;return{w,prompt:`<div class="q zh">${esc(w.h)}</div><div class="qtext">= “${esc(m)}” ?</div>`,opts:[{t:'Đúng',ok:truth},{t:'Sai',ok:!truth}]}});
  runQuiz(qs,{title:'Đúng hay sai',timer:45,onEnd:(s,t,wr)=>{best(gi,s);resultView('Đúng hay sai',s,t,wr,()=>tfGame(gi),'',null,GB)}})}
function challenge(seed,target){
  rnd=mulberry(seed);const ws=sample(W,10);const qs=ws.map((w,k)=>makeQ(w,['meaning','hanzi','listen','pinyin'][k%4],W));rnd=Math.random;
  runQuiz(qs,{title:target!=null?'Nhận thách đấu':'Thách đấu',onEnd:(s,t,wr)=>{
    qAdd('game');const link=location.href.split('#')[0]+'#c-'+seed+'-'+s;
    const msg=target==null?`<p>Bạn được <b>${s}/10</b>. Gửi link này cho bạn bè:</p>`:`<p>Bạn được <b>${s}/10</b>, bạn của bạn được <b>${target}/10</b>. ${s>target?'Bạn thắng!':s===target?'Hòa!':'Bạn thua rồi, thử lại nhé!'}</p><p>Thách lại họ bằng link này:</p>`;
    resultView('Thách đấu',s,t,wr,()=>challenge(seed,target),`<div class="card">${msg}<div class="linkbox">${esc(link)}</div><button class="wide btn2" id="cp" style="margin-top:10px">Sao chép link</button></div>`,null,GB);
    $('#cp').onclick=async()=>{try{await navigator.clipboard.writeText(link);toast('Đã sao chép link')}catch(e){toast('Không sao chép được — giữ tay vào link để chép')}};
  }});
}

// ===== ĐIỀU HƯỚNG =====
document.addEventListener('click',e=>{
  const s=e.target.closest('[data-say]');if(s){e.stopPropagation();e.preventDefault();say(s.dataset.say);return}
  const f=e.target.closest('[data-fav]');if(f){e.stopPropagation();e.preventDefault();const h=f.dataset.fav;if(S.fav[h])delete S.fav[h];else S.fav[h]=1;save();document.querySelectorAll(`[data-fav="${CSS.escape(h)}"]`).forEach(x=>x.classList.toggle('on',!!S.fav[h]));toast(S.fav[h]?'Đã lưu vào sổ từ: '+h:'Đã bỏ lưu '+h);return}
  const w=e.target.closest('[data-word]');if(w){e.preventDefault();RUN++;navOn('dict');wordView(w.dataset.word)}
},true);
const TAB={home:'home',review:'home',listen:'home',writing:'home',grammar:'home',exam:'home',dict:'dict',idioms:'dict',games:'games',explore:'explore',name:'explore',friends:'explore',me:'me'};
const navOn=v=>document.querySelectorAll('nav a').forEach(a=>a.classList.toggle('on',a.dataset.v===v));
function route(){
  RUN++;try{window.speechSynthesis&&speechSynthesis.cancel()}catch(e){}
  const h=location.hash.slice(1)||'home';
  const m=h.match(/^c-(\d+)-(\d+)$/);
  if(!S.onboard&&!m)return ob(1);
  document.body.classList.remove('ob');
  navOn(h.startsWith('bai-')?'home':TAB[h]||'home');
  window.scrollTo(0,0);
  if(m){V.innerHTML=`<h2>Bạn được thách đấu!</h2><div class="card hero"><div><p>Bạn của bạn làm đúng <b>${+m[2]}/10</b> câu. Bạn có vượt qua được không?</p></div>${mascot()}</div><button class="wide" id="acc">Nhận thách đấu</button>`;$('#acc').onclick=()=>challenge(+m[1],+m[2]);return}
  const b=h.match(/^bai-(\d+)$/);if(b)return openLesson(+b[1]-1);
  (views[h]||views.home)();
}
window.addEventListener('hashchange',route);
try{if('serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('sw.js')}catch(e){}
document.body.insertAdjacentHTML('afterbegin',NG_DEFS);{const hs=$('header svg');if(hs)hs.outerHTML=nghe('head','hlogo')}
applyLook();chips();route();


}
</script>
